<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 اصنع رسالتك</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#160019,#4a003f,#100015);
color:white;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:500px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,.09);
backdrop-filter:blur(15px);
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

h1{
text-align:center;
font-size:30px;
margin-top:0;
}

p{
text-align:center;
color:#ddd;
}

label{
display:block;
margin:18px 0 8px;
font-weight:bold;
}

input,textarea{
width:100%;
padding:15px;
border:0;
border-radius:14px;
background:rgba(255,255,255,.12);
color:white;
font-size:16px;
outline:none;
}

textarea{
height:150px;
resize:none;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:0;
border-radius:14px;
background:linear-gradient(90deg,#ff2f92,#9b4dff);
color:white;
font-size:17px;
font-weight:bold;
}

#result{
display:none;
margin-top:20px;
padding:15px;
background:rgba(0,0,0,.25);
border-radius:15px;
}

#link{
direction:ltr;
word-break:break-all;
margin-top:10px;
color:#ff9dcc;
}
</style>
</head>

<body>

<div class="card">

<h1>💌 اصنع رسالتك</h1>

<p>
اكتب اسم الشخص ورسالتك، واعمل صفحة مخصوصة ليه ❤️
</p>

<label>اسم الشخص</label>
<input id="name" placeholder="مثلاً: حنين">

<label>الرسالة</label>
<textarea id="message" placeholder="اكتب رسالتك هنا..."></textarea>

<label>اسمك — اختياري</label>
<input id="sender" placeholder="مثلاً: عبد الرحمن">

<button onclick="createMessage()">
✨ إنشاء الرسالة
</button>

<div id="result">

<b>✅ تم إنشاء الرسالة</b>

<div id="link"></div>

<button onclick="copyLink()">
📋 نسخ الرابط
</button>

</div>

</div>

<script>

function createMessage(){

let name=document.getElementById("name").value.trim();
let message=document.getElementById("message").value.trim();
let sender=document.getElementById("sender").value.trim();

if(!name || !message){

alert("اكتب الاسم والرسالة الأول ❤️");

return;

}

let data={
name:name,
message:message,
sender:sender
};

let encoded=btoa(
unescape(
encodeURIComponent(
JSON.stringify(data)
)
)
);

let url=
location.origin+
"/message.html?data="+
encodeURIComponent(encoded);

document.getElementById("link").textContent=url;

document.getElementById("result").style.display="block";

}

function copyLink(){

let link=document.getElementById("link").textContent;

navigator.clipboard.writeText(link);

alert("تم نسخ الرابط ✅");

}

</script>

</body>
</html>
