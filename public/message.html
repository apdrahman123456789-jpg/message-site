<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة 💌</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
padding:25px;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
text-align:center;
color:white;
background:
radial-gradient(circle at top,#65005d,#21001f 55%,#070008);
overflow:hidden;
}

.heart{
position:fixed;
font-size:25px;
animation:fall 6s linear infinite;
opacity:.7;
}

@keyframes fall{
0%{
transform:translateY(-100px) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(360deg);
}
}

.card{
position:relative;
z-index:2;
width:100%;
max-width:600px;
padding:35px 25px;
border-radius:30px;
background:rgba(255,255,255,.09);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 20px 70px rgba(0,0,0,.5);
animation:show 1s ease;
}

@keyframes show{
from{
opacity:0;
transform:scale(.9);
}
to{
opacity:1;
transform:scale(1);
}
}

h1{
font-size:34px;
margin:0 0 25px;
color:#ff9dce;
}

.message{
white-space:pre-wrap;
line-height:2;
font-size:19px;
color:#f5f5f5;
text-align:right;
}

.sender{
margin-top:30px;
color:#ffaad4;
font-size:17px;
}
</style>
</head>

<body>

<div class="heart" style="left:10%;animation-delay:0s">❤️</div>
<div class="heart" style="left:30%;animation-delay:2s">💗</div>
<div class="heart" style="left:55%;animation-delay:1s">💕</div>
<div class="heart" style="left:80%;animation-delay:3s">❤️</div>

<div class="card">

<h1 id="title">💌</h1>

<div class="message" id="message"></div>

<div class="sender" id="sender"></div>

</div>

<script>

const params = new URLSearchParams(location.search);

const encoded = params.get("data");

try{

const data = JSON.parse(
decodeURIComponent(
escape(
atob(encoded)
)
)
);

document.getElementById("title").textContent =
"إلى " + data.name + " ❤️";

document.getElementById("message").textContent =
data.message;

if(data.sender){

document.getElementById("sender").textContent =
"— من " + data.sender;

}

}catch(error){

document.getElementById("title").textContent =
"الرابط غير صحيح 😕";

document.getElementById("message").textContent =
"افتح رابط رسالة صحيح.";

}

</script>

</body>
</html>
